# Install with `prek install`. The clippy hook targets Linux explicitly so it
# also runs on a non-Linux workstation (the crate refuses to build elsewhere);
# it needs `rustup target add x86_64-unknown-linux-gnu` there.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --target x86_64-unknown-linux-gnu --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
