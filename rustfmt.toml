# STABLE-channel options only, so `cargo fmt` on stable emits no warnings.
edition = "2024"
max_width = 100
# "Default", never "Max": Max one-lines everything that fits under max_width.
use_small_heuristics = "Default"
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
merge_derives = true
use_field_init_shorthand = true
use_try_shorthand = true
remove_nested_parens = true
